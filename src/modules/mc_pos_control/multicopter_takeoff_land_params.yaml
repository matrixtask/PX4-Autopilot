module_name: mc_pos_control
parameters:
- group: Multicopter Position Control
  definitions:
    MPC_TKO_RAMP_T:
      description:
        short: Smooth takeoff ramp time constant
        long: |-
          Increasing this value will make climb rate controlled takeoff slower.
          If it's too slow the drone might scratch the ground and tip over.
          A time constant of 0 disables the ramp
          After a takeoff stand (MPC_TKO_STD_THR > 0) the upward velocity is not limited: the vertical
          velocity integrator starts at the stand thrust and the climb trajectory (acceleration limited to
          MPC_TKO_SPEED / MPC_TKO_RAMP_T) raises the thrust from there; this time only sets the switch to flight.
      type: float
      default: 3.0
      unit: s
      min: 0
      max: 5
    MPC_TKO_STD_THR:
      description:
        short: Stand-on-main-gear thrust before lift-off (fraction of hover thrust)
        long: |-
          For a vehicle that rests tilted (Mk-7: nose gear shorter). Before the takeoff ramp the attitude is held
          level while the thrust ramps to this fraction of the hover thrust in MPC_TKO_STD_T, so the vehicle stands
          on its main gear and the rate integrator takes the CG moment. When level within MPC_TKO_STD_TOL for
          MPC_TKO_STD_HLD the climb starts from this thrust (position hold, integrators kept, see MPC_TKO_RAMP_T). Not level
          after MPC_TKO_STD_TMO: takeoff aborted until disarmed. 0 disables (upstream takeoff).
      type: float
      default: 0.0
      min: 0.0
      max: 0.95
      decimal: 2
    MPC_TKO_STD_T:
      description:
        short: Thrust ramp time of the stand phase
      type: float
      default: 3.0
      unit: s
      min: 0.0
      max: 20.0
      decimal: 1
    MPC_TKO_STD_TOL:
      description:
        short: Pitch level tolerance to end the stand phase (roll follows the ground)
      type: float
      default: 0.5
      unit: deg
      min: 0.1
      max: 5.0
      decimal: 1
    MPC_TKO_STD_HLD:
      description:
        short: Time level within MPC_TKO_STD_TOL to end the stand phase
      type: float
      default: 0.5
      unit: s
      min: 0.0
      max: 5.0
      decimal: 1
    MPC_TKO_STD_TMO:
      description:
        short: Stand phase timeout (takeoff aborted)
      type: float
      default: 15.0
      unit: s
      min: 3.0
      max: 60.0
      decimal: 1
    MPC_TKO_STD_RMX:
      description:
        short: Maximum ground roll for the takeoff stand
        long: |-
          On the gear the roll is set by the ground: during the stand the roll target follows the measured roll
          (only the pitch is levelled), and the last value fades out to level over MPC_TKO_RAMP_T. Beyond this
          roll the takeoff is aborted. This is the aircraft roll on its gear, not the ground slope: the gear springs
          take part of the slope (Mk-7 SITL: 3 deg pad -> 2.5 deg roll, 6 deg pad -> 4.2 deg roll), so 5 deg here
          is about a 7 deg pad. Set it from a measured pad-slope / roll relation.
      type: float
      default: 5.0
      unit: deg
      min: 0.0
      max: 15.0
      decimal: 1
    MPC_TKO_SPEED:
      description:
        short: Takeoff climb rate
      type: float
      default: 1.5
      unit: m/s
      min: 1
      max: 5
      decimal: 2
    MPC_LAND_ALT1:
      description:
        short: Altitude for 1. step of slow landing (descend)
        long: |-
          Below this altitude descending velocity gets limited to a value
          between "MPC_Z_VEL_MAX_DN" (or "MPC_Z_V_AUTO_DN") and "MPC_LAND_SPEED"
          Value needs to be higher than "MPC_LAND_ALT2"
      type: float
      default: 10.0
      unit: m
      min: 0
      max: 122
      decimal: 1
    MPC_LAND_ALT2:
      description:
        short: Altitude for 2. step of slow landing (landing)
        long: |-
          Below this altitude descending velocity gets
          limited to "MPC_LAND_SPEED"
          Value needs to be lower than "MPC_LAND_ALT1"
      type: float
      default: 5.0
      unit: m
      min: 0
      max: 122
      decimal: 1
    MPC_LAND_ALT3:
      description:
        short: Altitude for 3. step of slow landing
        long: |-
          If a valid distance sensor measurement to the ground is available,
          limit descending velocity to "MPC_LAND_CRWL" below this altitude.
      type: float
      default: 1.0
      unit: m
      min: 0
      max: 122
      decimal: 1
    MPC_LAND_SLOPE:
      description:
        short: Steepest ground slope accepted for an automatic landing
        long: |-
          With a terrain camera (landing_surface): below MPC_LAND_ALT1 the descent stops while the measured ground
          plane under the vehicle is steeper than this, instead of touching down one gear first on a slope the
          aircraft cannot stand on; what follows is MPC_LAND_SLP_ACT. 0 = no check.
      type: float
      default: 0.0
      unit: deg
      min: 0
      max: 30
      decimal: 1
    MPC_LAND_SLP_ACT:
      description:
        short: Action when the landing site is too steep
        long: |-
          0: stop the descent and hold.
          1: search nearby (MPC_LND_SRCH_*): fly to candidate points on rings around the pad, starting downhill,
          measure each with the terrain camera and land on the first one that is flat enough (MPC_LAND_SLOPE),
          smooth (MPC_LND_ROUGH) and free of steps or obstacles (90 % of the points on the plane). If none is
          found, as 2.
          2: manual landing: hold and ask the pilot to take over (Position mode).
      type: enum
      values:
        0: Hold
        1: Search for a site, then manual
        2: Manual landing
      default: 0
    MPC_LND_SRCH_H:
      description:
        short: Landing-site search height
        long: Landing-gear height above the ground while flying between and measuring search candidates.
      type: float
      default: 10.0
      unit: m
      min: 3
      max: 50
      decimal: 1
    MPC_LND_SRCH_S:
      description:
        short: Landing-site search ring spacing
        long: Radius step between candidate rings and spacing of the points on a ring. About the terrain camera footprint at MPC_LND_SRCH_H.
      type: float
      default: 12.0
      unit: m
      min: 2
      max: 100
      decimal: 1
    MPC_LND_SRCH_R:
      description:
        short: Landing-site search radius
        long: Largest distance from the original landing point to search; beyond it the landing becomes manual.
      type: float
      default: 40.0
      unit: m
      min: 0
      max: 500
      decimal: 0
    MPC_LND_ROUGH:
      description:
        short: Roughest ground accepted by the landing-site search
        long: RMS deviation of the measured points from the fitted plane.
      type: float
      default: 0.15
      unit: m
      min: 0.01
      max: 2
      decimal: 2
    MPC_LAND_V_APP:
      description:
        short: Landing approach speed (measured-surface profile)
        long: |-
          With a measured height above the ground (terrain camera or range sensor) the vertical landing follows a
          descent-speed profile: MPC_Z_V_AUTO_DN (descent limit) braking to this speed at MPC_LAND_H_APP, then
          MPC_LAND_CRWL from MPC_LAND_ALT3, then a flare from MPC_LAND_CRWL to MPC_LAND_FLR_V over the last
          MPC_LAND_FLR_H. Heights are landing-gear heights. 0 = off (MPC_LAND_ALT1/ALT2 interpolation as upstream).
      type: float
      default: 0.0
      unit: m/s
      min: 0
      max: 3
      decimal: 2
    MPC_LAND_H_APP:
      description:
        short: Landing approach gate height
        long: Landing-gear height at which the descent has slowed to MPC_LAND_V_APP.
      type: float
      default: 3.0
      unit: m
      min: 0.5
      max: 20
      decimal: 1
    MPC_LAND_FLR_H:
      description:
        short: Landing flare height
        long: Landing-gear height below which the sink rate is reduced linearly from MPC_LAND_CRWL to MPC_LAND_FLR_V.
      type: float
      default: 0.3
      unit: m
      min: 0
      max: 2
      decimal: 2
    MPC_LAND_FLR_V:
      description:
        short: Landing sink rate at contact
      type: float
      default: 0.1
      unit: m/s
      min: 0.05
      max: 1
      decimal: 2
    MPC_LAND_DEC:
      description:
        short: Landing profile braking deceleration
        long: Deceleration of the braking curves in front of the approach and crawl gates (jerk MPC_JERK_AUTO). Keep below MPC_ACC_DOWN_MAX.
      type: float
      default: 1.0
      unit: m/s^2
      min: 0.1
      max: 5
      decimal: 2
    MPC_LAND_JERK:
      description:
        short: Jerk limit of the vertical landing
        long: Replaces MPC_JERK_AUTO while landing (auto land / mission land), for the descent profile braking. 0 = MPC_JERK_AUTO.
      type: float
      default: 0.0
      unit: m/s^3
      min: 0
      max: 10
      decimal: 2
    MPC_LND_GEAR_NX:
      description:
        short: Landing gear, nose contact point forward of the vehicle origin
        long: |-
          Tricycle gear contact points in the body frame (FRD, m) for the gear clearance on a sloped landing
          surface (landing_surface): nose (NX, 0, NZ), mains (MX, +-MY, MZ). The slowdown below MPC_LAND_ALT1/2/3
          uses the clearance of the lowest contact point instead of the height of the vehicle origin.
      type: float
      default: 0.0
      unit: m
      min: -20
      max: 20
      decimal: 3
    MPC_LND_GEAR_NZ:
      description:
        short: Landing gear, nose contact point below the vehicle origin
      type: float
      default: 0.0
      unit: m
      min: -10
      max: 10
      decimal: 3
    MPC_LND_GEAR_MX:
      description:
        short: Landing gear, main contact points forward of the vehicle origin
      type: float
      default: 0.0
      unit: m
      min: -20
      max: 20
      decimal: 3
    MPC_LND_GEAR_MY:
      description:
        short: Landing gear, main contact points half track
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 20
      decimal: 3
    MPC_LND_GEAR_MZ:
      description:
        short: Landing gear, main contact points below the vehicle origin
      type: float
      default: 0.0
      unit: m
      min: -10
      max: 10
      decimal: 3
    MPC_LAND_SPEED:
      description:
        short: Landing descend rate
      type: float
      default: 0.7
      unit: m/s
      min: 0.6
      decimal: 1
    MPC_LAND_CRWL:
      description:
        short: Land crawl descend rate
        long: Used below MPC_LAND_ALT3 if distance sensor data is availabe.
      type: float
      default: 0.3
      unit: m/s
      min: 0.1
      decimal: 1
