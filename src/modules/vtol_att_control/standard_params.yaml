module_name: vtol_att_control
parameters:
- group: VTOL Attitude Control
  definitions:
    VT_FWD_THRUST_EN:
      description:
        short: Use fixed-wing actuation in hover to accelerate forward
        long: |-
          Prevents downforce from pitching the body down when facing wind.
          Uses puller/pusher (standard VTOL), or forward-tilt (tiltrotor VTOL) to accelerate forward instead.
          Only active if demanded pitch  is below VT_PITCH_MIN.
          Use VT_FWD_THRUST_SC to tune it.
          Descend mode is treated as Landing too.

          Only active (if enabled) in height-rate controlled modes.
      type: enum
      values:
        0: Disabled
        1: Enabled (except LANDING)
        2: Enabled if above MPC_LAND_ALT1
        3: Enabled if above MPC_LAND_ALT2
        4: Enabled constantly
        5: Enabled if above MPC_LAND_ALT1 (except LANDING)
        6: Enabled if above MPC_LAND_ALT2 (except LANDING)
      default: 0
    VT_FWD_THRUST_SC:
      description:
        short: Fixed-wing actuation thrust scale in hover
        long: |-
          Scale applied to the demanded pitch (below VT_PITCH_MIN) to get the fixed-wing forward actuation in hover mode.
          Enabled via VT_FWD_THRUST_EN.
      type: float
      default: 0.7
      min: 0.0
      max: 5.0
      increment: 0.01
      decimal: 2
    VT_B_TRANS_RAMP:
      description:
        short: Back transition MC motor ramp up time
        long: This sets the duration during which the MC motors ramp up to the commanded
          thrust during the back transition stage.
      type: float
      default: 3.0
      unit: s
      min: 0.0
      max: 20.0
      increment: 0.1
      decimal: 1
    VT_B_RAMP_MIN:
      description:
        short: Back transition MC motor ramp START weight (overlap floor)
        long: At the start of the back transition the MC motor (mc_weight) ramp begins from
          this floor instead of 0, so the lift rotors provide partial thrust IMMEDIATELY and
          overlap with the still-flying wing -> removes the zero-thrust spin-up free-fall dip.
          0 = stock behaviour (ramp from 0).
      type: float
      default: 0.0
      min: 0.0
      max: 0.9
      increment: 0.05
      decimal: 2
    VT_LIFT_HND_V:
      description:
        short: Airspeed-scheduled wing->rotor lift-handoff speed [m/s]
        long: |-
          During a VTOL transition, floor the MC motor weight on an AIRSPEED SCHEDULE:
          floor = max(0, 1 - (CAS/VT_LIFT_HND_V)^2). VT_LIFT_HND_V is the airspeed at which
          the WING ALONE carries the full weight (lift = W at the trim CL). So at/above this
          speed the rotors are ~0 (wing carries all -> normal FW transition untouched), and
          as speed bleeds the rotors smoothly take over EXACTLY the lift the wing is losing
          (wing+rotor ~= weight, continuous handoff) -> no abrupt unload, no free-fall dip,
          minimal extra power. 0 = disabled (use the flat VT_B_RAMP_MIN instead).
      type: float
      default: 0.0
      min: 0.0
      max: 80.0
      increment: 1.0
      decimal: 1
    VT_LIFT_HND_SLW:
      description:
        short: Lift-rotor handover slew rate after the front transition
        long: |-
          After the front transition the lift-rotor collective moves from its value at the end of the transition
          to the airspeed schedule (VT_LIFT_HND_V / VT_LIFT_HND_THR), and after 25 s to zero, at no more than this
          rate (hover-thrust units per second). 0 = no limit (step).
      type: float
      default: 0.0
      unit: 1/s
      min: 0.0
      max: 1.0
      decimal: 3
      increment: 0.01
    VT_LIFT_HND_KV:
      description:
        short: Lift-rotor climb-rate assist during the FW handover
        long: |-
          While the lift rotors still carry part of the weight after the front transition, they add this
          collective per m/s of climb-rate error (TECS height-rate setpoint minus actual), weighted by their
          remaining share, so the vehicle does not sink while the wing pitches up. 0 = off.
      type: float
      default: 0.0
      min: 0.0
      max: 0.2
      decimal: 3
      increment: 0.005
    VT_LIFT_HND_AOA:
      description:
        short: Wing angle of attack for the full weight at VT_LIFT_HND_V (CCV feed-forward)
        long: |-
          After the front transition, the pitch setpoint is raised by this angle times the rotor weight share
          the lift rotors have given up since FW entry, times (VT_LIFT_HND_V / airspeed)^2, so the wing takes
          over the lift as the rotors release it instead of after the vehicle has started to sink. Washes out
          (20 s) once the rotors are off. 0 = off.
      type: float
      default: 0.0
      unit: deg
      min: 0.0
      max: 15.0
      decimal: 1
      increment: 0.1
    VT_SIG_TAU:
      description:
        short: Airspeed filter time constant for the rotor/wing schedules
        long: |-
          The airspeed that drives the rotor/wing schedules (transition blend, lift-handoff floor, FW handover)
          is first-order filtered with this time constant, so gusts and sensor noise do not move the actuator
          split. 0 = unfiltered.
      type: float
      default: 0.0
      unit: s
      min: 0.0
      max: 5.0
      decimal: 1
      increment: 0.1
    VT_SIG_RATE:
      description:
        short: Maximum rate of the rotor weight in the front transition
        long: |-
          The MC (rotor) weight in the front transition follows the airspeed schedule at no more than this rate.
          0 = unlimited.
      type: float
      default: 0.0
      unit: 1/s
      min: 0.0
      max: 2.0
      decimal: 2
      increment: 0.05
    VT_LIFT_HND_THR:
      description:
        short: Lift-rotor collective at the FW handoff (hover-thrust scale) [-]
        long: |-
          Peak lift-rotor collective commanded in FW_MODE during the forward-transition
          climb-out to bridge the MC->FW lift-handoff valley. In FW the MC thrust setpoint is
          ~0 (wing+pusher fly), so the stock 2 s fade has nothing to scale and the rotors cut
          to zero the instant the transition completes (~CAS 54) while the wing only makes full
          lift at VT_LIFT_HND_V (~72). This commands an ABSOLUTE up-thrust = VT_LIFT_HND_THR *
          (1 - (CAS/VT_LIFT_HND_V)^2) so the rotors carry the wing's lift deficit and release
          smoothly as CAS -> VT_LIFT_HND_V. Active ONLY while CAS < VT_LIFT_HND_V and within
          ~25 s of FW entry (never re-engages in cruise / P8 brake / P9 descent). Set to the
          airframe hover collective (~0.6); lower to trade a deeper valley for less rotor drag/
          energy, raise for a shallower valley. 0 = disabled (stock instant cut).
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      increment: 0.05
      decimal: 2
    VT_FW_RDIFF:
      description:
        short: Lift-rotor DIFFERENTIAL roll authority in FW mode [0..1]
        long: |-
          When > 0 AND the lift rotors are running (VT_FW_MC_THR > 0), route the multicopter roll
          torque to the lift-rotor DIFFERENTIAL so roll authority is AIRSPEED-INDEPENDENT. The FW
          ailerons lose authority at low speed (dynamic pressure ~ V^2; e.g. 38 m/s is ~28 % of a
          72 m/s cruise), so a low-speed descent (P9) can have a lightly-damped roll oscillation the
          ailerons cannot suppress. The lift rotors, already spinning for descent support, can add the
          missing roll moment. Gated by VT_FW_RDIFF itself (the mission sets it > 0 ONLY in the
          low-speed descent) so it never leaks into the brake / cruise / turn. 0 = stock (FW ailerons
          only). 1 = full MC roll torque on the rotors.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      increment: 0.05
      decimal: 2
    VT_PSHER_SLEW:
      description:
        short: Pusher throttle ramp up slew rate
        long: |-
          Defines the slew rate of the puller/pusher throttle during transitions.
          Zero will deactivate the slew rate limiting and thus produce an instant throttle
          rise to the transition throttle VT_F_TRANS_THR.
      type: float
      default: 0.33
      unit: 1/s
      min: 0
      increment: 0.01
      decimal: 2
    VT_FW_MC_THR:
      description:
        short: Lift-rotor collective in FW mode for a rotor-borne steep climb [0..1]
        long: |-
          When > 0, command ALL lift rotors at this uniform collective thrust while in FW_MODE
          (symmetric -> pure upward body force, no moment; the FW surfaces keep attitude). Lets
          the rotors carry weight / add climb force so the vehicle can climb steeper than the
          forward-thrust-limited pusher allows alone (the design 1/4 climb is intrinsically a
          low-speed rotor-borne climb). Set by the mission during the climb phase, 0 at cruise.
          0 = stock FW (rotors idle/faded). This is the Mk-7 rotor-assisted climb lever.
      type: float
      default: 0.0
      min: 0.0
      max: 0.9
      increment: 0.02
      decimal: 2
    VT_RD_EN:
      description:
        short: Torque redistribution between control surfaces and lift rotors
        long: |-
          Above VT_RD_VMIN, in transitions and fixed-wing flight: roll and pitch torque the control surfaces
          cannot give (unallocated) is converted with the authority ratio KS q / (BU rho/rho0) and added to the
          lift rotors; in transitions, torque the lift rotors cannot give goes to the surfaces. In fixed-wing
          flight the lift rotors are spun up to the collective the differential needs (VT_RD_COLL, VT_RD_CMAX)
          and kept for VT_RD_HOLD after the last excess. Use with FW_TQ_LIM > 1 so that the rate controller
          can ask for more than the surfaces give.
      type: boolean
      default: 0
    VT_RD_KS_R:
      description:
        short: Surface roll moment per dynamic pressure at full roll torque [m^3]
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      decimal: 3
      increment: 0.01
    VT_RD_KS_P:
      description:
        short: Surface pitch moment per dynamic pressure at full pitch torque [m^3]
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      decimal: 3
      increment: 0.01
    VT_RD_BU_R:
      description:
        short: Lift-rotor roll moment at full roll torque setpoint (sea-level density)
      type: float
      default: 0.0
      unit: Nm
      min: 0.0
      max: 200000.0
      decimal: 0
      increment: 100
    VT_RD_BU_P:
      description:
        short: Lift-rotor pitch moment at full pitch torque setpoint (sea-level density)
      type: float
      default: 0.0
      unit: Nm
      min: 0.0
      max: 200000.0
      decimal: 0
      increment: 100
    VT_RD_COLL:
      description:
        short: Lift-rotor collective per unit redistributed torque
        long: The differential needs a collective of about the torque setpoint on each side.
      type: float
      default: 1.0
      min: 0.0
      max: 2.0
      decimal: 2
      increment: 0.05
    VT_RD_CMAX:
      description:
        short: Maximum lift-rotor collective for the redistribution
      type: float
      default: 0.5
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.05
    VT_RD_HOLD:
      description:
        short: Lift-rotor hold time after the last surface saturation
      type: float
      default: 3.0
      unit: s
      min: 0.0
      max: 30.0
      decimal: 1
      increment: 0.5
    VT_RD_SLEW:
      description:
        short: Lift-rotor collective rise rate for the redistribution
        long: Fall rate is a fifth of it.
      type: float
      default: 4.0
      unit: 1/s
      min: 0.0
      max: 20.0
      decimal: 1
      increment: 0.5
    VT_RD_VMIN:
      description:
        short: Minimum calibrated airspeed for the redistribution
      type: float
      default: 20.0
      unit: m/s
      min: 0.0
      max: 60.0
      decimal: 0
      increment: 1
