module_name: fw_att_control
parameters:
- group: FW Attitude Control
  definitions:
    FW_R_TC:
      description:
        short: Attitude Roll Time Constant
        long: |-
          This defines the latency between a roll step input and the achieved setpoint
          (inverse to a P gain). Smaller systems may require smaller values.
      type: float
      default: 0.4
      unit: s
      min: 0.2
      max: 1.0
      decimal: 2
      increment: 0.05
    FW_P_TC:
      description:
        short: Attitude pitch time constant
        long: |-
          This defines the latency between a pitch step input and the achieved setpoint
          (inverse to a P gain). Smaller systems may require smaller values.
      type: float
      default: 0.4
      unit: s
      min: 0.2
      max: 1.0
      decimal: 2
      increment: 0.05
    FW_P_RMAX_POS:
      description:
        short: Maximum positive / up pitch rate setpoint
      type: float
      default: 60.0
      unit: deg/s
      min: 0.0
      max: 180
      decimal: 1
      increment: 0.5
    FW_P_RMAX_NEG:
      description:
        short: Maximum negative / down pitch rate setpoint
      type: float
      default: 60.0
      unit: deg/s
      min: 0.0
      max: 180
      decimal: 1
      increment: 0.5
    FW_R_RMAX:
      description:
        short: Maximum roll rate setpoint
      type: float
      default: 70.0
      unit: deg/s
      min: 0.0
      max: 180
      decimal: 1
      increment: 0.5
    FW_Y_RMAX:
      description:
        short: Maximum yaw rate setpoint
      type: float
      default: 50.0
      unit: deg/s
      min: 0.0
      max: 180
      decimal: 1
      increment: 0.5
    FW_W_EN:
      description:
        short: Enable wheel steering controller
        long: |-
          Only enabled during automatic runway takeoff and landing.
          In all manual modes the wheel is directly controlled with yaw stick.
      type: boolean
      default: 0
    FW_WR_P:
      description:
        short: Wheel steering rate proportional gain
        long: |-
          This defines how much the wheel steering input will be commanded depending on the
          current body angular rate error.
      type: float
      default: 0.5
      unit: '%/rad/s'
      min: 0.0
      max: 10
      decimal: 3
      increment: 0.005
    FW_WR_I:
      description:
        short: Wheel steering rate integrator gain
        long: |-
          This gain defines how much control response will result out of a steady
          state error. It trims any constant error.
      type: float
      default: 0.1
      unit: '%/rad'
      min: 0.0
      max: 10
      decimal: 3
      increment: 0.005
    FW_WR_IMAX:
      description:
        short: Wheel steering rate integrator limit
      type: float
      default: 0.4
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.05
    FW_W_RMAX:
      description:
        short: Maximum wheel steering rate
        long: |-
          This limits the maximum wheel steering rate the controller will output (in degrees per
          second).
      type: float
      default: 30.0
      unit: deg/s
      min: 0.0
      max: 90.0
      decimal: 1
      increment: 0.5
    FW_WR_FF:
      description:
        short: Wheel steering rate feed forward
      type: float
      default: 0.2
      unit: '%/rad/s'
      min: 0.0
      max: 10
      decimal: 2
      increment: 0.05
    FW_PSP_OFF:
      description:
        short: Pitch setpoint offset (pitch at level flight)
        long: |-
          An airframe specific offset of the pitch setpoint in degrees, the value is
          added to the pitch setpoint and should correspond to the pitch at
          typical cruise speed of the airframe.
      type: float
      default: 0.0
      unit: deg
      min: -90.0
      max: 90.0
      decimal: 1
      increment: 0.5
    FW_MAN_YR_MAX:
      description:
        short: Maximum manually added yaw rate
        long: |-
          This is the maximally added yaw rate setpoint from the yaw stick in any attitude controlled flight mode.
          It is added to the yaw rate setpoint generated by the controller for turn coordination.
      type: float
      default: 30.0
      unit: deg/s
      min: 0
      decimal: 1
      increment: 0.5
    FW_MAN_R_MAX:
      description:
        short: Maximum manual roll angle
        long: Applies to both directions in all manual modes with attitude stabilization
      type: float
      default: 45.0
      unit: deg
      min: 0.0
      max: 90.0
      decimal: 1
      increment: 0.5
    FW_MAN_P_MAX:
      description:
        short: Maximum manual pitch angle
        long: Applies to both directions in all manual modes with attitude stabilization
          but without altitude control
      type: float
      default: 30.0
      unit: deg
      min: 0.0
      max: 90.0
      decimal: 1
      increment: 0.5
- group: FW Upset Recovery
  definitions:
    FW_UPS_EN:
      description:
        short: Enable the upset recovery
        long: |-
          When the tilt (angle between the body z axis and the vertical) exceeds FW_UPS_TILT in fixed-wing
          flight or a transition, the attitude controller ignores the guidance attitude: it rolls the wings
          level by the shortest way while holding the pitch, then pulls the nose to the horizon at the load
          factor FW_UPS_NZ. Thrust is limited to FW_UPS_THR while the nose is below -FW_UPS_P_DN or the
          aircraft is inverted. Ends when the tilt is below FW_UPS_EXIT and the nose is above -FW_UPS_P_DN.
      type: boolean
      default: 0
    FW_UPS_TILT:
      description:
        short: Upset recovery entry tilt
      type: float
      default: 60.0
      unit: deg
      min: 30.0
      max: 120.0
      decimal: 0
      increment: 5
    FW_UPS_EXIT:
      description:
        short: Upset recovery exit tilt
        long: Must be below FW_UPS_TILT (hysteresis).
      type: float
      default: 20.0
      unit: deg
      min: 5.0
      max: 60.0
      decimal: 0
      increment: 5
    FW_UPS_RMAX:
      description:
        short: Upset recovery roll rate limit
        long: Replaces FW_R_RMAX during the recovery when larger.
      type: float
      default: 90.0
      unit: deg/s
      min: 0.0
      max: 180.0
      decimal: 0
      increment: 5
    FW_UPS_NZ:
      description:
        short: Upset recovery pull-out load factor
        long: Limits the pitch-up rate to (FW_UPS_NZ - 1) g / V during the pull-out.
      type: float
      default: 2.5
      unit: g0
      min: 1.2
      max: 4.0
      decimal: 1
      increment: 0.1
    FW_UPS_P_DN:
      description:
        short: Upset recovery nose-low pitch
        long: Below -FW_UPS_P_DN the thrust is limited to FW_UPS_THR; the recovery ends only above it.
      type: float
      default: 10.0
      unit: deg
      min: 0.0
      max: 45.0
      decimal: 0
      increment: 1
    FW_UPS_THR:
      description:
        short: Upset recovery thrust limit (nose low or inverted)
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.05
    FW_UPS_RT_TRG:
      description:
        short: Upset recovery rate trigger
        long: |-
          Roll or pitch rate that starts the recovery when it lasts FW_UPS_RT_T. Must be well above the rates of normal
          manoeuvres (FW_R_RMAX, FW_P_RMAX_*). 0 disables the rate trigger.
      type: float
      default: 90.0
      unit: deg/s
      min: 0.0
      max: 180.0
      decimal: 0
      increment: 5
    FW_UPS_RT_T:
      description:
        short: Upset recovery rate trigger time
      type: float
      default: 0.2
      unit: s
      min: 0.0
      max: 2.0
      decimal: 2
      increment: 0.05
    FW_UPS_D_TRG:
      description:
        short: Upset recovery disturbance trigger
        long: |-
          Roll or pitch angular acceleration that the control surfaces do not explain, in units of the full surface
          authority (FW_INDI_G_R / FW_INDI_G_P times the dynamic pressure), high-passed with 1 s. Starts the recovery
          when it lasts FW_UPS_D_T: a wake vortex or a strong gust is detected before the attitude has gone.
          0 disables the disturbance trigger (also when FW_INDI_G_R / FW_INDI_G_P are 0).
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      decimal: 2
      increment: 0.1
    FW_UPS_D_T:
      description:
        short: Upset recovery disturbance trigger time
      type: float
      default: 0.1
      unit: s
      min: 0.0
      max: 2.0
      decimal: 2
      increment: 0.05
