module_name: mc_rate_control
parameters:
- group: Multicopter Rate Control
  definitions:
    MC_ROLLRATE_P:
      description:
        short: Roll rate P gain
        long: Roll rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.5
      decimal: 3
      increment: 0.01
    MC_ROLLRATE_I:
      description:
        short: Roll rate I gain
        long: Roll rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_RR_INT_LIM:
      description:
        short: Roll rate integrator limit
        long: Roll rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large roll moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_ROLLRATE_D:
      description:
        short: Roll rate D gain
        long: Roll rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      max: 0.01
      decimal: 4
      increment: 0.0005
    MC_ROLLRATE_FF:
      description:
        short: Roll rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_ROLLRATE_K:
      description:
        short: Roll rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_ROLLRATE_K * (MC_ROLLRATE_P * error
          + MC_ROLLRATE_I * error_integral
          + MC_ROLLRATE_D * error_derivative)
          ```
          Set MC_ROLLRATE_P=1 to implement a PID in the ideal form.
          Set MC_ROLLRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_P:
      description:
        short: Pitch rate P gain
        long: Pitch rate proportional gain, i.e. control output for angular speed
          error 1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_PITCHRATE_I:
      description:
        short: Pitch rate I gain
        long: Pitch rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_PR_INT_LIM:
      description:
        short: Pitch rate integrator limit
        long: Pitch rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large pitch moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_PITCHRATE_D:
      description:
        short: Pitch rate D gain
        long: Pitch rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_FF:
      description:
        short: Pitch rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_PITCHRATE_K:
      description:
        short: Pitch rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_PITCHRATE_K * (MC_PITCHRATE_P * error
          + MC_PITCHRATE_I * error_integral
          + MC_PITCHRATE_D * error_derivative)
          ```
          Set MC_PITCHRATE_P=1 to implement a PID in the ideal form.
          Set MC_PITCHRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_P:
      description:
        short: Yaw rate P gain
        long: Yaw rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.2
      min: 0.0
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_YAWRATE_I:
      description:
        short: Yaw rate I gain
        long: Yaw rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.1
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_YR_INT_LIM:
      description:
        short: Yaw rate integrator limit
        long: Yaw rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large yaw moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_YAWRATE_D:
      description:
        short: Yaw rate D gain
        long: Yaw rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_FF:
      description:
        short: Yaw rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_YAWRATE_K:
      description:
        short: Yaw rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_YAWRATE_K * (MC_YAWRATE_P * error
          + MC_YAWRATE_I * error_integral
          + MC_YAWRATE_D * error_derivative)
          ```
          Set MC_YAWRATE_P=1 to implement a PID in the ideal form.
          Set MC_YAWRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_BAT_SCALE_EN:
      description:
        short: Battery power level scaler
        long: |-
          This compensates for voltage drop of the battery over time by attempting to
          normalize performance across the operating range of the battery. The copter
          should constantly behave as if it was fully charged with reduced max acceleration
          at lower battery percentages. i.e. if hover is at 0.5 throttle at 100% battery,
          it will still be 0.5 at 60% battery.
      type: boolean
      default: 0
    MC_ACC_FF_EN:
      description:
        short: Angular acceleration feed-forward axes
        long: |-
          Adds torque = (d/dt rate setpoint, 2 Hz low-pass) / MC_ID_B_x on the selected axes, limited to +-0.3,
          so a vehicle with a large inertia starts and brakes on the planned profile. An axis with MC_ID_B_x 0
          gets none.
      type: bitmask
      bit:
        0: Roll
        1: Pitch
        2: Yaw
      default: 0
      min: 0
      max: 7
    MC_ID_EN:
      description:
        short: In-flight control effectiveness identification
        long: |-
          1: estimate roll, pitch and yaw effectiveness in flight (any multicopter mode, manual included; calm air
          gives the cleanest result) from the torque setpoint and the measured angular acceleration, and on every
          landing save each converged axis provisionally (MC_ID_PB_x, with its excitation MC_ID_PX_x). The
          estimate does not change the control in flight. Setting MC_ID_CONFIRM 1 on the ground copies the
          provisional values to MC_ID_B_x, clears them and sets this parameter back to 0.
      type: enum
      values:
        0: Disabled
        1: Estimate and save provisionally
      default: 0
    MC_ID_CONFIRM:
      description:
        short: Confirm the provisional effectiveness
        long: |-
          Set to 1 on the ground after reviewing MC_ID_PB_x and MC_ID_PT_R/P: copies them to MC_ID_B_x and
          MC_TQ_TRIM_R/P, clears the provisional values and
          MC_ID_PX_x, stops the identification (MC_ID_EN 0) and resets itself to 0.
      type: boolean
      default: 0
    MC_ID_T:
      description:
        short: Forgetting window of the identification
      type: float
      default: 20.0
      min: 1.0
      max: 600.0
      unit: s
      decimal: 1
    MC_ID_TAU:
      description:
        short: Actuator time constant assumed by the identification
        long: |-
          The torque reaches the airframe through the rotor speed change; the regressor is lagged by this.
      type: float
      default: 0.15
      min: 0.0
      max: 1.0
      unit: s
      decimal: 3
    MC_ID_EXC:
      description:
        short: Minimum excitation for an identification update
        long: Band-passed torque times the current estimate, i.e. the angular acceleration the torque should give.
      type: float
      default: 0.005
      min: 0.0
      max: 1.0
      unit: rad/s^2
      decimal: 4
    MC_ID_TQLIM:
      description:
        short: Largest torque used by the identification
        long: |-
          Samples with a larger torque setpoint on any axis (and 0.5 s after) are skipped: rotors at idle or
          full deliver less torque than commanded, which would bias the estimate low.
      type: float
      default: 0.25
      min: 0.02
      max: 1.0
      decimal: 2
    MC_ID_B_R:
      description:
        short: Confirmed roll effectiveness
        long: |-
          Angular acceleration per unit roll torque [rad/s^2]. Used by the roll acceleration feed-forward
          (MC_ACC_FF_EN). 0 = unknown. Written by MC_ID_CONFIRM.
      type: float
      default: 0.0
      min: 0.0
      max: 50.0
      decimal: 3
    MC_ID_B_P:
      description:
        short: Confirmed pitch effectiveness
        long: |-
          Angular acceleration per unit pitch torque [rad/s^2]. Used by the pitch acceleration feed-forward
          (MC_ACC_FF_EN). 0 = unknown. Written by MC_ID_CONFIRM.
      type: float
      default: 0.0
      min: 0.0
      max: 50.0
      decimal: 3
    MC_ID_B_Y:
      description:
        short: Confirmed yaw effectiveness
        long: |-
          Angular acceleration per unit yaw torque [rad/s^2]. Used by the yaw acceleration feed-forward
          (MC_ACC_FF_EN). 0 = unknown. Written by MC_ID_CONFIRM.
      type: float
      default: 0.0
      min: 0.0
      max: 50.0
      decimal: 3
    MC_ID_PB_R:
      description:
        short: Provisional roll effectiveness (identified, not confirmed)
        long: |-
          Written on landing by MC_ID_EN 1. 0 = none.
      type: float
      default: 0.0
      min: 0.0
      max: 50.0
      decimal: 3
    MC_ID_PB_P:
      description:
        short: Provisional pitch effectiveness (identified, not confirmed)
        long: |-
          Written on landing by MC_ID_EN 1. 0 = none.
      type: float
      default: 0.0
      min: 0.0
      max: 50.0
      decimal: 3
    MC_ID_PB_Y:
      description:
        short: Provisional yaw effectiveness (identified, not confirmed)
        long: |-
          Written on landing by MC_ID_EN 1. 0 = none.
      type: float
      default: 0.0
      min: 0.0
      max: 50.0
      decimal: 3
    MC_ID_PX_R:
      description:
        short: Excitation behind MC_ID_PB_R
        long: |-
          Largest forgetting-window-weighted seconds of usable excitation in the flight that wrote MC_ID_PB_R.
      type: float
      default: 0.0
      min: 0.0
      max: 1000.0
      unit: s
      decimal: 1
    MC_ID_PX_P:
      description:
        short: Excitation behind MC_ID_PB_P
        long: |-
          Largest forgetting-window-weighted seconds of usable excitation in the flight that wrote MC_ID_PB_P.
      type: float
      default: 0.0
      min: 0.0
      max: 1000.0
      unit: s
      decimal: 1
    MC_ID_PX_Y:
      description:
        short: Excitation behind MC_ID_PB_Y
        long: |-
          Largest forgetting-window-weighted seconds of usable excitation in the flight that wrote MC_ID_PB_Y.
      type: float
      default: 0.0
      min: 0.0
      max: 1000.0
      unit: s
      decimal: 1
    MC_TQ_TRIM_R:
      description:
        short: Hover roll trim torque
        long: |-
          Normalized roll torque added from arming on, for the steady moment of a CG offset, so it is there at
          lift-off (the rate integrator is held at zero on the ground). Written by MC_ID_CONFIRM from MC_ID_PT_R.
      type: float
      default: 0.0
      min: -0.3
      max: 0.3
      decimal: 4
    MC_ID_PT_R:
      description:
        short: Provisional hover roll trim torque (identified, not confirmed)
        long: Trim + rate integral averaged over a quiet hover (rates < 2 deg/s, at least 10 s), written on landing.
      type: float
      default: 0.0
      min: -0.3
      max: 0.3
      decimal: 4
    MC_TQ_TRIM_P:
      description:
        short: Hover pitch trim torque
        long: |-
          Normalized pitch torque added from arming on, for the steady moment of a CG offset, so it is there at
          lift-off (the rate integrator is held at zero on the ground). Written by MC_ID_CONFIRM from MC_ID_PT_P.
      type: float
      default: 0.0
      min: -0.3
      max: 0.3
      decimal: 4
    MC_ID_PT_P:
      description:
        short: Provisional hover pitch trim torque (identified, not confirmed)
        long: Trim + rate integral averaged over a quiet hover (rates < 2 deg/s, at least 10 s), written on landing.
      type: float
      default: 0.0
      min: -0.3
      max: 0.3
      decimal: 4
    MC_YAW_TQ_CUTOFF:
      description:
        short: Low pass filter cutoff frequency for yaw torque setpoint
        long: |-
          Reduces vibrations by lowering high frequency torque caused by rotor acceleration.
          0 disables the filter
      type: float
      default: 2.0
      min: 0
      max: 10
      unit: Hz
      decimal: 3
